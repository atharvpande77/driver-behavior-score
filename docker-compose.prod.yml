# docker-compose.prod.yml
#
# Production environment overlay.
# Usage:
#   docker compose \
#     --env-file .env.prod \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     up -d
#
# Key differences from dev:
#   - Uses .env.prod for all services
#   - ENVIRONMENT is hard-pinned to prevent .env bleedthrough
#   - Inherits postgres_data volume from base (no volume override)
#   - No command override — uses Dockerfile CMD (gunicorn)
#   - No source volume mounts

services:
  backend:
    env_file:
      - path: .env.prod
        required: true
    environment:
      ENVIRONMENT: production

  telematics:
    env_file:
      - path: .env.prod
        required: true
    environment:
      ENVIRONMENT: production

  workers:
    env_file:
      - path: .env.prod
        required: true
    environment:
      ENVIRONMENT: production
