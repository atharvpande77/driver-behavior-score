# docker-compose.staging.yml
#
# Staging environment overlay.
# Usage:
#   docker compose \
#     --env-file .env.staging \
#     -f docker-compose.yml \
#     -f docker-compose.staging.yml \
#     up -d
#
# Key differences from dev:
#   - telematics and workers are disabled (profile: full)
#   - Postgres uses a separate DB (dbs_staging) and volume (postgres_staging_data)
#   - Backend uses gunicorn (prod-replica, no hot-reload, no source volume mount)
#   - Backend port 8001 (dev uses 8000)
#   - Critical vars pinned in environment: block to prevent .env bleedthrough

services:
  postgres:
    environment:
      POSTGRES_DB: dbs_staging     # hardcoded — overrides ${POSTGRES_DB} from base
    volumes:
      - postgres_staging_data:/var/lib/postgresql

  backend:
    env_file:
      - .env.staging
    ports:
      - "${STAGING_APP_PORT:-8001}:8000"
    environment:
      ENVIRONMENT: staging
      # Pinned here so it can never be shadowed by the base .env file.
      # ${POSTGRES_USER} and ${POSTGRES_PASSWORD} are resolved from
      # --env-file .env.staging at compose parse time.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dbs_staging"
    # No volumes — uses the built Docker image (prod-replica behavior)
    # No command override — uses Dockerfile CMD (gunicorn)

  telematics:
    profiles:
      - full  # not started unless --profile full is passed

  workers:
    profiles:
      - full  # not started unless --profile full is passed

volumes:
  postgres_staging_data:
    driver: local
